name = "tadween-example-site"
main = "dist/_worker.js/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "CONTENT"
bucket_name = "tadween-content"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "tadween-media"

# wrangler secret put TADWEEN_PREVIEW_SECRET  (same value as the dashboard)
